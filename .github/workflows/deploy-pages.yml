name: Deploy GitHub Pages (ITT Ciudad Paraíso)

# Publica el sitio estático de resultados agregados en GitHub Pages.
# Se dispara al hacer push a master tocando datos/salidas/scripts del sitio,
# o manualmente desde la pestaña Actions (workflow_dispatch).
on:
  push:
    branches: [master]
    paths:
      - "github_pages/**"
      - "outputs/itt_ciudad_paraiso/**"
      - "data/Ciudad_Paraiso/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (solo lo necesario para el sitio)
        uses: actions/checkout@v4
        with:
          # Se incluye TODA data/Ciudad_Paraiso (~11 MB) en vez de listar subcarpetas:
          # evita que falte alguna (p.ej. "2_Dimensión_Cohesion_Social" con tilde, que
          # contiene VIF) y simplifica el mantenimiento.
          sparse-checkout: |
            github_pages
            outputs/itt_ciudad_paraiso
            data/Ciudad_Paraiso

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del generador
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl geopandas rasterio folium osmnx pillow matplotlib

      - name: Generar tablas + galería (data.json, index.html)
        run: python github_pages/build_site.py

      - name: Generar mapa (ubicación + tipo de evento)
        # Si la descarga OSM falla en el runner, el mapa se genera igual sin red peatonal.
        run: python github_pages/build_map.py
        continue-on-error: false

      - name: Auditoría de privacidad (bloquea el deploy si hay fuga)
        run: python github_pages/audit_privacy.py

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: github_pages/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
